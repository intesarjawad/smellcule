name: release
on:
  push:
    tags: ["v*"]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "SMELLCULE_CATALOGUE=$(cat config/catalogue)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {version: 0.13.7, enable-cache: true}
      - run: uv sync --all-groups --all-extras --locked
      - run: uv run ruff format --check && uv run ruff check && uv run pyright
      - run: uv run pytest -m "not data"
  publish:
    needs: check
    if: vars.SMELLCULE_RELEASE_READY == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions: {id-token: write}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: {version: 0.13.7}
      - run: uv build --locked
      - uses: pypa/gh-action-pypi-publish@release/v1
