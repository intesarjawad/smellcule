name: Bug report
description: Report unexpected behaviour
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and error including next step
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
    validations:
      required: true
